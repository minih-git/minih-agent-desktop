<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minih 远程 · 移动端原型</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Segoe UI",Roboto,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    background:#e7e7ea;color:#1a1c1f;min-height:100vh;
    display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:28px 24px 48px;
    -webkit-font-smoothing:antialiased;
  }
  body.page-dark{background:#0e0e10;color:#e9e9ea}

  /* ---------- side panel (prototype controls, not part of the design) ---------- */
  .panel{width:248px;flex:none;position:sticky;top:28px;font-size:13px}
  .panel h1{font-size:17px;margin:0 0 4px}
  .panel p.lead{margin:0 0 18px;color:#6b6b70;line-height:1.5}
  body.page-dark .panel p.lead{color:#9b9b9f}
  .panel h2{font-size:12px;font-weight:600;color:#6b6b70;margin:18px 0 8px;letter-spacing:.02em}
  body.page-dark .panel h2{color:#9b9b9f}
  .seg{display:flex;background:rgba(0,0,0,.06);border-radius:10px;padding:2px}
  body.page-dark .seg{background:rgba(255,255,255,.08)}
  .seg button{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:8px;font:inherit;color:inherit;cursor:pointer}
  .seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
  body.page-dark .seg button.on{background:#3a3a3e}
  .jump{display:flex;flex-direction:column;gap:4px}
  .jump button{text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;font:inherit;color:inherit;cursor:pointer}
  .jump button:hover{background:rgba(0,0,0,.06)}
  body.page-dark .jump button:hover{background:rgba(255,255,255,.08)}
  .jump button.on{background:rgba(0,0,0,.08);font-weight:600}
  body.page-dark .jump button.on{background:rgba(255,255,255,.12)}
  .panel .reset{margin-top:18px;width:100%;border:1px solid rgba(0,0,0,.14);background:transparent;padding:8px;border-radius:10px;font:inherit;color:inherit;cursor:pointer}
  body.page-dark .panel .reset{border-color:rgba(255,255,255,.18)}
  .panel .tip{margin-top:14px;color:#6b6b70;line-height:1.55}
  body.page-dark .panel .tip{color:#9b9b9f}

  /* ---------- device ---------- */
  .phone{
    width:390px;height:844px;border-radius:55px;position:relative;overflow:hidden;flex:none;
    box-shadow:0 0 0 11px #18181a,0 0 0 13px #3b3b3f,0 34px 80px rgba(0,0,0,.33);
    --sat:47px;--sab:34px;
  }
  .phone[data-theme=light]{
    --page:#f3f3f3;--surface:#fff;--raised:#fff;--inset:#ededed;--bubble:#ededed;
    --tp:#1a1c1f;--ts:rgba(26,28,31,.74);--tm:#5d5d5d;--tf:#afafaf;--sep:rgba(26,28,31,.08);
    --accent:#1a1c1f;--on-accent:#fff;--running:#c2410c;--decision:#7c3aed;--on-decision:#fff;--success:#00802f;--error:#d42a26;--link:#1c64c8;
    --navbg:rgba(243,243,243,.92);--tint:10%;--shadow:0 8px 24px rgba(0,0,0,.08);--scrim:rgba(0,0,0,.28);
  }
  .phone[data-theme=dark]{
    --page:#181818;--surface:#212121;--raised:#282828;--inset:#0d0d0d;--bubble:#2c2c2c;
    --tp:#fff;--ts:rgba(255,255,255,.7);--tm:#9b9b9b;--tf:#5d5d5d;--sep:rgba(255,255,255,.08);
    --accent:#fff;--on-accent:#1a1c1f;--running:#ff8549;--decision:#c27aff;--on-decision:#1a1c1f;--success:#40c977;--error:#ff6764;--link:#63a8f8;
    --navbg:rgba(24,24,24,.92);--tint:16%;--shadow:0 0 0 0 transparent;--scrim:rgba(0,0,0,.5);
  }
  .statusbar{position:absolute;left:0;right:0;top:0;height:var(--sat);z-index:90;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;color:var(--tp);font-weight:600;font-size:16px;pointer-events:none}
  .island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px}
  .sb-right{display:flex;gap:6px;align-items:center}
  .bars{display:flex;gap:2px;align-items:flex-end;height:11px}
  .bars i{display:block;width:3px;background:currentColor;border-radius:1px}
  .battery{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;opacity:.9;position:relative;padding:1.5px}
  .battery::after{content:"";display:block;height:100%;width:78%;background:currentColor;border-radius:1.5px}
  .homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--tp);z-index:90;pointer-events:none}

  #app{position:absolute;inset:0;background:var(--page)}

  /* ---------- screen shell ---------- */
  .scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--page);color:var(--tp)}
  .scr.enter-push{animation:push .28s cubic-bezier(.2,0,0,1)}
  .scr.enter-pop{animation:pop .28s cubic-bezier(.2,0,0,1)}
  @keyframes push{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
  @keyframes pop{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
  .nav{flex:none;padding-top:var(--sat);background:var(--navbg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);position:relative;z-index:5;transition:box-shadow .2s}
  .nav.scrolled{box-shadow:0 1px 0 var(--sep)}
  .nav-row{height:44px;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:0 4px}
  .nav-l{display:flex}.nav-r{display:flex;justify-content:flex-end}
  .nav-c{text-align:center;min-width:0}
  .nav-title{font-size:17px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-sub{font-size:12px;line-height:15px;color:var(--tm);display:flex;align-items:center;justify-content:center;gap:5px}
  .nav-large .nav-title{opacity:0;transition:opacity .2s}
  .nav-large.scrolled .nav-title{opacity:1}
  .content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px calc(24px + var(--sab));scrollbar-width:none}
  .content::-webkit-scrollbar{display:none}
  .scr.has-dock .content{padding-bottom:16px}
  .dock{flex:none;padding:12px 16px calc(8px + var(--sab));background:var(--page);position:relative;z-index:4}
  .dock.lift{box-shadow:0 -1px 0 var(--sep)}
  .dock .stack{display:flex;flex-direction:column;gap:10px}

  /* ---------- type ---------- */
  .large-title{font-size:28px;line-height:34px;font-weight:700;margin:0;letter-spacing:-.01em}
  .headline{font-size:16px;line-height:22px;font-weight:600}
  .callout{font-size:15px;line-height:22px;color:var(--ts);margin:0}
  .subhead{font-size:14px;line-height:20px;color:var(--ts)}
  .footnote{font-size:13px;line-height:18px;color:var(--tm)}
  .caption{font-size:12px;line-height:16px;font-weight:500}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  /* ---------- controls ---------- */
  .ic{display:block;flex:none}
  .iconbtn{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--tp);border-radius:12px;cursor:pointer;padding:0}
  .iconbtn:active{opacity:.55}
  .btn{height:44px;border-radius:12px;font:600 16px/1 inherit;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;padding:0 16px;cursor:pointer;transition:transform .12s ease-out,opacity .12s;white-space:nowrap}
  .btn:active:not(:disabled){transform:scale(.98)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn-lg{height:52px;width:100%;font-size:17px}
  .btn-primary{background:var(--accent);color:var(--on-accent)}
  .btn-secondary{background:var(--surface);color:var(--tp);box-shadow:inset 0 0 0 1px var(--sep)}
  .btn-plain{background:transparent;color:var(--tp)}
  .btn-destructive{background:var(--surface);color:var(--error);box-shadow:inset 0 0 0 1px var(--sep)}
  .btn-danger{background:var(--error);color:#fff}
  .btn-sm{height:36px;padding:0 14px;font-size:15px;border-radius:10px}
  .spin{animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .group{background:var(--surface);border-radius:16px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 4px 10px 16px;position:relative;width:100%;border:0;background:transparent;color:inherit;text-align:left;font:inherit;cursor:default}
  button.row{cursor:pointer}
  button.row:active{background:color-mix(in srgb,var(--tp) 4%,transparent)}
  .row.compact{min-height:52px}
  .group > * + *::before{content:"";position:absolute;top:0;right:0;left:var(--inset-left,60px);height:1px;background:var(--sep)}
  .row-main{flex:1;min-width:0}
  .row-title{font-size:16px;line-height:22px;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .row-sub{font-size:14px;line-height:20px;color:var(--ts);margin-top:2px}
  .row-trail{display:flex;align-items:center;color:var(--tf);flex:none}
  .tile{width:32px;height:32px;border-radius:9px;background:var(--inset);display:grid;place-items:center;color:var(--tp);flex:none;position:relative}
  .tile .badge{position:absolute;right:-3px;bottom:-3px;border:2px solid var(--surface);border-radius:50%}
  .sh{font-size:13px;line-height:18px;color:var(--tm);padding:24px 16px 8px;display:flex;justify-content:space-between;align-items:center}
  .sh:first-child{padding-top:12px}

  .dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
  .dot.s-online,.dot.s-done{background:var(--success)}
  .dot.s-running{background:var(--running);animation:breathe 1.6s ease-in-out 2}
  .dot.s-decision{background:var(--decision);animation:pulse 1.6s ease-in-out 2}
  .dot.s-error{background:var(--error)}
  .dot.s-offline{box-shadow:inset 0 0 0 1.5px var(--tm)}
  .dot.s-muted{background:var(--tf)}
  .dot.lg{width:10px;height:10px}
  @keyframes breathe{50%{opacity:.35}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--decision) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .slot{width:12px;display:grid;place-items:center;flex:none}

  .chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .chip.neutral{background:var(--inset);color:var(--ts)}
  .chip.running{background:color-mix(in srgb,var(--running) var(--tint),var(--surface));color:var(--running)}
  .chip.error{background:color-mix(in srgb,var(--error) var(--tint),var(--surface));color:var(--error)}
  .chip.decision{background:color-mix(in srgb,var(--decision) var(--tint),var(--surface));color:var(--decision)}

  .banner{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 16px;font-size:14px;line-height:20px;flex:none;animation:fadeDown .2s cubic-bezier(.2,0,0,1)}
  .banner .grow{flex:1}
  .banner.neutral{background:var(--inset);color:var(--ts)}
  .banner.running{background:color-mix(in srgb,var(--running) var(--tint),var(--page));color:var(--running)}
  .banner.error{background:color-mix(in srgb,var(--error) var(--tint),var(--page));color:var(--error)}
  .banner .btn-sm{height:30px;font-size:14px;padding:0 10px;background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .calloutbox{border-radius:12px;padding:12px 14px;font-size:15px;line-height:22px;background:var(--inset);color:var(--ts)}
  .calloutbox.error{background:color-mix(in srgb,var(--error) var(--tint),var(--surface));color:var(--error)}
  .calloutbox ol{margin:0;padding-left:20px}
  .calloutbox ol li+li{margin-top:6px}

  .field-label{font-size:13px;line-height:18px;color:var(--tm);margin:20px 4px 8px;display:block}
  .field{display:flex;align-items:center;background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 1px var(--sep);min-height:52px;padding:0 6px 0 14px;gap:6px}
  .field:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
  .field input,.field textarea{flex:1;border:0;outline:0;background:transparent;color:var(--tp);font:16px/24px inherit;font-family:inherit;padding:13px 0;min-width:0}
  .field textarea{resize:none;padding:13px 0}
  .field .mono,.field input.mono,.field textarea.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px}
  .field input::placeholder,.field textarea::placeholder{color:var(--tf)}
  .helper{font-size:13px;line-height:18px;color:var(--tm);margin:8px 4px 0;display:flex;gap:6px;align-items:flex-start}
  .helper.ok{color:var(--success)}
  .paste{height:36px;border-radius:10px;border:0;background:var(--inset);color:var(--tp);font:600 14px inherit;font-family:inherit;padding:0 12px;display:flex;align-items:center;gap:6px;cursor:pointer;align-self:flex-start;margin-top:8px}

  /* connect */
  .hero{padding:32px 4px 24px}
  .mark{width:64px;height:64px;border-radius:16px;display:block;margin-bottom:22px;box-shadow:0 1px 0 var(--sep)}
  .hero .callout{margin-top:10px}
  .foot{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--tm);margin:12px 0 0}

  /* stepper */
  .stepper{display:flex;align-items:center;gap:8px;padding:6px 4px 4px;font-size:13px;color:var(--tf)}
  .stepper .on{color:var(--tp);font-weight:600}
  .stepper .done{color:var(--ts)}
  .stepper .line{flex:1;height:1px;background:var(--sep)}

  /* waiting */
  .wait{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 12px 8px}
  .ring{position:relative;width:104px;height:104px;margin-bottom:22px}
  .ring svg{transform:rotate(-90deg)}
  .ring .t{position:absolute;inset:0;display:grid;place-items:center;font:600 20px ui-monospace,"SF Mono",Menlo,monospace;color:var(--tp)}
  .result{display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 16px 8px}
  .result .big{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin-bottom:20px}
  .result .big.ok{background:color-mix(in srgb,var(--success) var(--tint),var(--surface));color:var(--success)}
  .result .callout{margin-top:8px}

  /* expand callout in host rows */
  .host-expand{padding:0 16px 14px 60px;animation:fadeDown .2s cubic-bezier(.2,0,0,1)}
  .host-expand p{margin:0 0 10px;font-size:14px;line-height:20px;color:var(--ts)}

  /* skeleton */
  .skel{background:var(--inset);border-radius:6px;animation:skel 1.2s ease-in-out infinite}
  @keyframes skel{50%{opacity:.5}}

  /* session */
  .runbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;background:var(--surface);box-shadow:0 1px 0 var(--sep);position:relative;z-index:4;animation:fadeDown .2s cubic-bezier(.2,0,0,1)}
  .runbar .label{font-size:15px;font-weight:600}
  .runbar .grow{flex:1}
  .runbar .btn{height:36px;padding:0 12px;font-size:15px;border-radius:10px}
  .tl{display:flex;flex-direction:column;gap:14px;padding:16px 0 8px}
  .m-user{align-self:flex-end;max-width:85%;background:var(--bubble);border-radius:18px 18px 6px 18px;padding:10px 14px;font-size:16px;line-height:24px;white-space:pre-wrap;word-break:break-word}
  .m-user.pending{opacity:.6}
  .m-user .pend{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--tm);margin-top:2px}
  .m-ai{font-size:16px;line-height:24px;white-space:pre-wrap;word-break:break-word}
  .m-ai code,.m-user code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;color:var(--link);background:var(--inset);padding:1px 5px;border-radius:5px}
  .m-agent{font-size:12px;color:var(--tm);margin-bottom:2px}
  .m-note{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tm)}
  .m-note::before,.m-note::after{content:"";flex:1;height:1px;background:var(--sep)}
  /* Tool calls are rows, not cards (spec §8.7): a category icon, the tool's
     short name, one line of what it acted on. Consecutive calls fold into one
     row so a burst of thirty is one line, not thirty boxes. */
  .tool-run{display:flex;flex-direction:column}
  .tool-run-head{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--ts);font:13px inherit;font-family:inherit;padding:8px 2px;min-height:40px;cursor:pointer;text-align:left}
  .tool-run-head .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tool-run-head .err{font-size:12px;color:var(--error);flex:none}
  .tool-run-body{list-style:none;margin:0 0 2px;padding:0 0 0 10px;border-left:1px solid var(--sep)}
  .tool-row{list-style:none}
  .tool-row-head{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:inherit;font:13px inherit;font-family:inherit;padding:6px 2px;min-height:38px;cursor:pointer;text-align:left}
  .tool-ic{color:var(--tm);display:inline-flex;flex:none}
  .tool-row-name{font-size:13px;color:var(--ts);flex:none}
  .tool-row-sum{flex:1;min-width:0;font-size:13px;color:var(--tm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tool-row-body{margin:0 0 8px;background:var(--inset);border-radius:8px;padding:9px 11px;font:12px/18px ui-monospace,"SF Mono",Menlo,monospace;color:var(--ts);white-space:pre;overflow-x:auto;max-height:200px}
  .st-run{color:var(--running)}.st-ok{color:var(--success)}.st-err{color:var(--error)}.st-dec{color:var(--decision)}.st-mute{color:var(--tm)}
  .think{border:0;background:transparent;color:var(--tm);font:13px inherit;font-family:inherit;display:flex;align-items:center;gap:4px;padding:6px 0;cursor:pointer;align-self:flex-start}
  .think-body{font-size:14px;line-height:21px;color:var(--tm);border-left:2px solid var(--sep);padding:2px 0 2px 12px;margin-top:-6px}
  .m-fail{border-radius:12px;padding:10px 14px;background:color-mix(in srgb,var(--error) var(--tint),var(--surface));color:var(--error);font-size:15px}
  .newpill{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 10px);background:var(--raised);color:var(--tp);border:0;height:34px;padding:0 14px;border-radius:999px;font:600 14px inherit;font-family:inherit;display:flex;align-items:center;gap:6px;box-shadow:0 0 0 1px var(--sep),0 6px 18px rgba(0,0,0,.14);cursor:pointer;animation:fadeDown .2s}

  .decision{background:var(--surface);border-radius:16px;padding:14px 14px 14px 16px;margin-bottom:10px;box-shadow:0 0 0 1px color-mix(in srgb,var(--decision) 38%,transparent),var(--shadow);max-height:clamp(200px,calc(var(--ph,844px) - 400px),calc(var(--ph,844px) * .55));overflow-y:auto;overscroll-behavior:contain;animation:rise .28s cubic-bezier(.2,0,0,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .d-head{display:flex;align-items:center;gap:8px;color:var(--decision);font-weight:700;font-size:15px}
  .d-head .grow{flex:1}
  .d-pager{display:flex;align-items:center;color:var(--tm);font-size:13px;font-weight:500}
  .d-pager .iconbtn{width:32px;height:32px;color:var(--tm)}
  .d-meta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .d-sum{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;line-height:21px;background:var(--inset);border-radius:10px;padding:10px 12px;margin-top:10px;overflow-wrap:anywhere}
  .d-note{font-size:15px;line-height:22px;color:var(--ts);margin-top:8px}
  .d-warn{display:flex;gap:6px;align-items:flex-start;font-size:14px;line-height:20px;color:var(--error);margin-top:10px}
  .d-exp{font-size:13px;color:var(--tm);margin-top:8px;display:flex;align-items:center;gap:5px}
  .d-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .d-actions .btn{width:100%}
  .d-cap{font-size:12px;color:var(--tm);margin-top:10px}
  .q-text{font-size:16px;line-height:23px;font-weight:600;margin:10px 0 4px}
  .q-hint{font-size:13px;color:var(--tm);margin-bottom:8px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border:0;border-radius:12px;background:var(--inset);color:var(--tp);font:15px inherit;font-family:inherit;text-align:left;padding:12px 14px;cursor:pointer;margin-top:8px}
  .opt.sel{background:color-mix(in srgb,var(--decision) var(--tint),var(--surface));box-shadow:inset 0 0 0 1.5px var(--decision)}
  .mark-r{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--tf);flex:none;display:grid;place-items:center}

  .q-foot{display:flex;align-items:center;gap:8px;margin-top:14px}

  .composer{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border-radius:22px;box-shadow:inset 0 0 0 1px var(--sep);padding:6px 6px 6px 16px}
  .composer textarea{flex:1;border:0;outline:0;background:transparent;resize:none;color:var(--tp);font:16px/24px inherit;font-family:inherit;padding:4px 0;max-height:144px;min-height:32px}

  .send{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;cursor:pointer;transition:opacity .12s}
  .send:disabled{opacity:.25;cursor:default}
  .c-hint{font-size:13px;color:var(--tm);margin:0 6px 8px;display:flex;align-items:center;gap:6px}
  .c-hint.err{color:var(--error)}
  .archived{text-align:center;font-size:14px;color:var(--tm);padding:12px}

  /* sheet + toast */
  .scrim{position:absolute;inset:0;background:var(--scrim);z-index:60;animation:fade .2s}
  @keyframes fade{from{opacity:0}}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--raised);border-radius:20px 20px 0 0;z-index:61;padding:8px 16px calc(16px + var(--sab));animation:sheet .28s cubic-bezier(.2,0,0,1);color:var(--tp)}
  @keyframes sheet{from{transform:translateY(100%)}}
  .grabber{width:36px;height:5px;border-radius:3px;background:var(--tf);margin:0 auto 12px;opacity:.6}
  .sheet-title{font-size:17px;font-weight:600;text-align:center;margin:4px 0 4px}

  .sheet-opt .t{font-size:16px;font-weight:600}

  .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--toast-bottom,120px));z-index:70;background:var(--tp);color:var(--page);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;animation:toast .2s cubic-bezier(.2,0,0,1);box-shadow:0 8px 24px rgba(0,0,0,.2)}

const sessionsData=[

function sessionWord(){
  const s=S.session;
  if(s.decisions.length) return {st:'decision',word:s.decisions[0].kind==='approval'?'等你批准':'等你回答'};
  if(s.turn==='running') return {st:'running',word:'运行中'};
  return {st:'done',word:''};
}

function turnLabel(s){
  if(s.stopping) return ['s-running','正在停止…'];
  const d=s.decisions[0];
  if(d) return ['s-decision', d.kind==='approval'?'等你批准':'等你回答'];
  if(s.turn==='running') return ['s-running','运行中'];
  return null;
}
function scrSession(){
  const s=S.session;
  const banner = s.conn==='retrying'?`<div class="banner running">${spinner(16)}<span class="grow">正在重新连接…</span></div>`
    : s.conn==='exhausted'?`<div class="banner error">${icon('alert',16)}<span class="grow">实时更新已停止</span><button class="btn btn-sm" data-act="reconnect">重新连接</button></div>`:'';
  const tl=turnLabel(s);
  const runbar = tl?`<div class="runbar"><span class="dot lg ${tl[0]}"></span><span class="label">${tl[1]}</span>${s.queued?`<span class="chip neutral">排队 ${s.queued} 条</span>`:''}<span class="grow"></span><button class="btn btn-secondary" data-act="stop" ${s.stopping?'disabled':''}>${icon('square',14,2.4)}停止</button></div>`:'';
  // Consecutive tool calls fold into one row (spec §8.7). The prototype keeps
  // the grouping rule here, mirroring `groupConsecutiveToolRuns` in
  // `packages/shared/src/tool-presentation.ts`, so the mock-up and the shipped
  // timeline read the same.
  const items=(()=>{
    const out=[]; let i=0;
    while(i<s.items.length){
      if(s.items[i].k!=='tool'){ out.push(itemHtml(s.items[i],i)); i+=1; continue; }
      const start=i;
      while(i<s.items.length&&s.items[i].k==='tool') i+=1;
      const burst=s.items.slice(start,i);
      if(burst.length===1){ out.push(itemHtml(burst[0],start)); continue; }
      const key='run'+start;
      const open=!!s.open[key];
      const parts=toolRunParts(burst);
      const failed=burst.filter(x=>x.st==='err'||x.st==='deny').length;
      out.push(`<li class="tool-run"><button class="tool-run-head" data-act="toggle" data-key="${key}" aria-expanded="${open}"><span class="tool-ic">${icon('wrench',14)}</span><span class="lbl">${parts}</span>${failed?`<span class="err">${failed} 处问题</span>`:''}<span style="color:var(--tf)">${icon(open?'chevronUp':'chevronDown',13)}</span></button>${open?`<ul class="tool-run-body">${burst.map((it,k)=>itemHtml(it,start+k)).join('')}</ul>`:''}</li>`);
    }
    return out.join('');
  })();
  const dec=s.decisions.length?decisionHtml():'';
  const hint = s.sendFail?`<div class="c-hint err">${icon('alert',14)}发送失败，点按发送重试。</div>`
    : (tl&&S.draft.trim())?`<div class="c-hint">${icon('clock',14)}电脑正在运行，这条消息会排队。</div>`:'';
  return `<div class="scr has-dock">
    ${nav({title:s.title,sub:'MacBook Pro'})}
    ${banner}${runbar}
    <div class="content" id="scroller"><div class="tl">${items}</div></div>
    <div class="dock lift" id="dock">
      ${dec}${hint}
      <div class="composer"><textarea id="composer" rows="1" placeholder="给 Agent 发消息" data-input="composer">${S.draft}</textarea><button class="send" id="sendBtn" data-act="send" aria-label="发送" ${S.draft.trim()?'':'disabled'}>${icon('arrowUp',20,2.4)}</button></div>
    </div></div>`;
}
function md(t){return t.replace(/`([^`]+)`/g,'<code>$1</code>')}
/** Which icon a tool call draws, by the same categories the shared rules use. */
function toolIconName(name){
  const n=(name||'').toLowerCase();
  if(/^(read|readfile)$/.test(n)) return 'fileText';
  if(/^(glob|list|listfiles)$/.test(n)) return 'folderOpen';
  if(/^(grep|rg|search|websearch)$/.test(n)) return 'search';
  if(/^(write|writefile)$/.test(n)) return 'pencil';
  if(/^(edit|applypatch|patch)$/.test(n)) return 'pencil';
  if(/^(bash|shell|exec|terminal)$/.test(n)) return 'terminal';
  if(/^(fetch|http|browser)$/.test(n)) return 'globe';
  if(/^(task|subagent|taskwait|tasklist|taskstop)$/.test(n)) return 'users';
  if(/^todowrite$/.test(n)) return 'listChecks';
  return 'wrench';
}
/** What a burst did, one clause per kind of work (spec §8.7). */
function toolRunParts(burst){
  const LABELS={run:(n)=>`${n} 条命令`,edit:(n)=>`编辑 ${n} 个文件`,write:(n)=>`写入 ${n} 个文件`,read:(n)=>`读取 ${n} 个文件`,search:(n)=>`${n} 次搜索`,fetch:(n)=>`抓取 ${n} 个网页`,other:(n)=>`${n} 个工具操作`};
  const counts={};
  for(const it of burst){
    const n=(it.name||'').toLowerCase();
    const k=/^(bash|shell|exec|terminal)$/.test(n)?'run':/^(edit|applypatch|patch)$/.test(n)?'edit':/^(write|writefile)$/.test(n)?'write':/^(read|readfile)$/.test(n)?'read':/^(grep|rg|search)$/.test(n)?'search':/^(fetch|http|browser)$/.test(n)?'fetch':'other';
    counts[k]=(counts[k]||0)+1;
  }
  const parts=[];
  for(const k of ['run','edit','write','read','search','fetch','other']){
    if(counts[k]&&parts.length<3) parts.push(LABELS[k](counts[k]));
  }
  return parts.join('，');
}
function itemHtml(it,i){
  const s=S.session;
  if(it.k==='note')return `<div class="m-note">${it.text}</div>`;
  if(it.k==='user')return `<div class="m-user${it.pending?' pending':''}">${md(it.text)}${it.pending?`<div class="pend">${icon('clock',12)}发送中</div>`:''}</div>`;
  if(it.k==='ai')return `<div>${it.agent?`<div class="m-agent">来自 ${it.agent}</div>`:''}<div class="m-ai">${md(it.text)}</div></div>`;
  if(it.k==='answer')return `<div class="m-user" style="background:color-mix(in srgb,var(--decision) var(--tint),var(--surface))"><div class="caption" style="color:var(--decision);margin-bottom:2px">你的回答</div>${it.text}</div>`;
  if(it.k==='fail')return `<div class="m-fail">${it.text}</div>`;
  if(it.k==='think'){const o=s.open['t'+i];return `<div style="display:flex;flex-direction:column"><button class="think" data-act="toggle" data-key="t${i}" aria-expanded="${!!o}">思考 ${icon(o?'chevronUp':'chevronDown',14)}</button>${o?`<div class="think-body">${it.text}</div>`:''}</div>`}
  if(it.k==='tool'){
    const o=s.open['k'+i];
    const st={run:`<span class="st-run">${spinner(14)}</span>`,ok:`<span class="st-ok">${icon('check',14,2.6)}</span>`,err:`<span class="st-err">${icon('alert',14)}</span>`,dec:`<span class="st-dec">${icon('shield',14)}</span>`,deny:`<span class="st-mute">${icon('x',14,2.4)}</span>`}[it.st];
    return `<li class="tool-row"><button class="tool-row-head" data-act="toggle" data-key="k${i}" aria-expanded="${!!o}"><span class="tool-ic">${icon(toolIconName(it.name),14)}</span><span class="tool-row-name">${it.name}</span><span class="tool-row-sum">${it.sum}</span>${st}${it.body?`<span style="color:var(--tf)">${icon(o?'chevronUp':'chevronDown',13)}</span>`:''}</button>${o&&it.body?`<pre class="tool-row-body">${it.body}</pre>`:''}</li>`;
  }
  return '';
}
function expiresText(ms){const sec=Math.max(0,Math.round((ms-Date.now())/1000));return sec>=60?`${Math.ceil(sec/60)} 分钟后过期`:`${sec} 秒后过期`}
function decisionHtml(){
  const s=S.session; const n=s.decisions.length; const idx=Math.min(s.decIndex,n-1); const d=s.decisions[idx];
  const pager=n>1?`<span class="d-pager"><button class="iconbtn" data-act="dec-prev" aria-label="上一条" ${idx===0?'disabled':''}>${icon('chevronLeft',18)}</button>${idx+1}/${n}<button class="iconbtn" data-act="dec-next" aria-label="下一条" ${idx===n-1?'disabled':''}>${icon('chevronRight',18)}</button></span>`:'';
  const pend=s.pendingDecision;
  if(d.kind==='approval'){
    const riskChip={high:'<span class="chip error">高风险</span>',medium:'<span class="chip running">中风险</span>',low:'<span class="chip neutral">低风险</span>'}[d.risk];
    return `<div class="decision" role="region" aria-label="需要你批准">
      <div class="d-head">${icon('shield',18)}<span class="grow">需要你批准</span>${pager}</div>
      <div class="d-meta">${riskChip}<span class="mono caption" style="color:var(--ts)">${d.tool}</span></div>
      <div class="d-sum">${d.cmd}</div>
      <div class="d-note">${d.note}</div>
      ${d.risk==='high'?`<div class="d-warn">${icon('alert',16)}<span>高风险操作：允许前请确认命令内容。</span></div>`:''}
      <div class="d-exp">${icon('clock',13)}<span data-expires="${d.expires}">${expiresText(d.expires)}</span></div>
      <div class="d-actions">
        <button class="btn btn-destructive" data-act="decide" data-d="deny" ${pend?'disabled':''}>${pend==='deny'?spinner(16):''}拒绝</button>
        <button class="btn btn-primary" data-act="decide" data-d="allow" ${pend?'disabled':''}>${pend==='allow'?spinner(16):''}允许一次</button>
      </div>
      ${d.sessionGrant?'<div class="d-cap">“本会话内允许”只能在电脑上操作。</div>':''}
    </div>`;
  }
  const q=d.questions[d.step]; const sel=d.answers[d.step]||[];
  const last=d.step===d.questions.length-1;
  const ready=sel.length>0||d.skipped[d.step];
  return `<div class="decision" role="region" aria-label="Agent 有个问题">
    <div class="d-head">${icon('help',18)}<span class="grow">Agent 有个问题</span>${pager}</div>
    ${d.questions.length>1?`<div class="footnote" style="margin-top:8px">第 ${d.step+1}/${d.questions.length} 题</div>`:''}
    <div class="q-text">${q.q}</div>
    ${q.multi?'<div class="q-hint">可多选</div>':''}
    <div role="${q.multi?'group':'radiogroup'}">${q.options.map((o,oi)=>{const on=sel.includes(oi);return `<button class="opt${on?' sel':''}" role="${q.multi?'checkbox':'radio'}" aria-checked="${on}" data-act="opt" data-o="${oi}"><span class="mark-r${q.multi?' mark-c':''}">${on?icon('check',13,3):''}</span>${o}</button>`}).join('')}</div>
    <div class="q-foot">
      ${d.step>0?`<button class="btn btn-plain btn-sm" data-act="q-prev">上一题</button>`:''}
      <button class="btn btn-plain btn-sm" data-act="skip" style="color:var(--tm)">${d.skipped[d.step]?'已跳过':'跳过此题'}</button>
      <span class="grow"></span>
      ${last?`<button class="btn btn-primary btn-sm" data-act="answer" ${ready&&!pend?'':'disabled'}>${pend?spinner(16):''}发送回答</button>`
        :`<button class="btn btn-primary btn-sm" data-act="q-next" ${ready?'':'disabled'}>下一题</button>`}
    </div>
  </div>`;
}

    <button class="sheet-opt" data-act="host-refresh" data-id="${h.id}">${icon('refresh',22)}<div><div class="t">刷新状态</div></div></button>
    ${h.status==='unaccepted'?`<button class="sheet-opt" data-act="host-askagain" data-id="${h.id}">${icon('phone',22)}<div><div class="t">重新申请</div><div class="d">到那台电脑上批准这台手机</div></div></button>`:''}
    <button class="sheet-opt danger" data-act="host-forget-ask" data-id="${h.id}">${icon('trash',22)}<div><div class="t">忘记这台电脑</div><div class="d">之后需要重新登录或配对</div></div></button>
    <button class="btn btn-plain btn-lg" data-act="sheet-close">取消</button></div>`}
  if(sh.type==='forget'){const h=host(sh.id);inner=`<div class="sheet-title">忘记“${h.name}”？</div><p class="sheet-msg">这台手机会删除它的访问权限，此后需要新的配对票据或重新申请。</p><div class="sheet-actions">
    <button class="btn btn-danger btn-lg" data-act="host-forget" data-id="${h.id}">忘记</button>
    <button class="btn btn-plain btn-lg" data-act="sheet-close">取消</button></div>`}
  if(sh.type==='stop') inner=`<div class="sheet-title">停止运行</div><p class="sheet-msg">选择停止方式。</p><div class="sheet-actions">
    <button class="sheet-opt" data-act="do-stop" data-how="graceful">${icon('pause',22)}<div><div class="t">完成当前步骤后停止</div><div class="d">等当前回复或工具调用结束，再停下</div></div></button>
    <button class="sheet-opt danger" data-act="do-stop" data-how="now">${icon('square',22)}<div><div class="t">立即停止</div><div class="d">马上中止，并取消排队中的消息</div></div></button>
    <button class="btn btn-plain btn-lg" data-act="sheet-close">取消</button></div>`;
  if(sh.type==='confirm-allow'){const d=S.session.decisions[0];inner=`<div class="sheet-title">确认允许这项高风险操作？</div><p class="sheet-msg">Agent 将在 MacBook Pro 上执行：</p>
    <div class="d-sum" style="margin:0 0 16px">${d.cmd}</div><div class="sheet-actions">
    <button class="btn btn-primary btn-lg" data-act="allow-confirm">允许一次</button>
    <button class="btn btn-plain btn-lg" data-act="sheet-close">取消</button></div>`;}
  return `<div class="scrim" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div>${inner}</div>`;
}

/* ---------------- render ---------------- */
let lastScreen=null;
function render(){
  const app=document.getElementById('app');
  const prevScroller=document.getElementById('scroller');
  const nearBottom = prevScroller ? (prevScroller.scrollHeight-prevScroller.scrollTop-prevScroller.clientHeight<120) : true;
  const prevTop = prevScroller?prevScroller.scrollTop:0;
  const focusId=document.activeElement&&document.activeElement.id;
  const map={connect:scrConnect,account:scrAccount,pair:scrPair,computers:scrComputers,sessions:scrSessions,session:scrSession};
  let html=map[S.screen]();
  const changed=lastScreen!==S.screen;
  if(changed) html=html.replace('class="scr','class="scr enter-'+S.dir+' ');
  const toastBottom = S.screen==='session' ? (document.getElementById('dock')?.offsetHeight||110)+14 : 120;
  html+=sheetHtml();
  if(S.toast) html+=`<div class="toast" style="--toast-bottom:${toastBottom}px" role="status">${S.toast.ok?icon('check',16,2.6):icon('alert',16)}${S.toast.text}</div>`;
  app.innerHTML=html;
  lastScreen=S.screen;
  const sc=document.getElementById('scroller');
  if(sc){
    if(S.screen==='session'){ if(changed||nearBottom) sc.scrollTop=sc.scrollHeight; else sc.scrollTop=prevTop; }
    else if(!changed) sc.scrollTop=prevTop;
    sc.addEventListener('scroll',onScroll); onScroll();
  }
  const ta=document.getElementById('composer'); if(ta){autosize(ta)}
  if(focusId&&!changed){const el=document.getElementById(focusId); if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')){el.focus();const v=el.value;el.setSelectionRange?.(v.length,v.length)}}
  syncPanel();
}
function onScroll(){const sc=document.getElementById('scroller');const n=document.getElementById('nav');if(sc&&n)n.classList.toggle('scrolled',sc.scrollTop>(n.classList.contains('nav-large')?36:2))}
function autosize(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,144)+'px'}

/* ---------------- session simulation ---------------- */
function pushItem(it){S.session.items.push(it)}
function lastTool(name){const its=S.session.items;for(let i=its.length-1;i>=0;i--)if(its[i].k==='tool'&&its[i].name===name)return its[i]}
function askQuestion(){
  S.session.decisions.push({kind:'input',step:0,answers:[[],[]],skipped:[false,false],questions:[
    {q:'登录失败时，错误提示怎么处理？',options:['保留原有文案','统一为“邮箱或密码错误”','我稍后再决定'],multi:false},
    {q:'需要同时补哪些测试？',options:['单元测试','端到端测试'],multi:true},
  ]});
  S.session.decIndex=0;
}
function runAfterApproval(allowed){
  const s=S.session; const t=lastTool('Bash');
  if(allowed){t.st='run';t.body='$ rm -rf apps/web/.next\n$ pnpm --filter web build\n  ▲ Next.js 15.2\n  Creating an optimized production build…';}
  else{t.st='deny';t.body='你拒绝了这项操作。';pushItem({k:'ai',text:'好的，我不清理缓存，直接做增量构建。'})}
  s.turn='running'; render();
  later(()=>{
    if(S.session!==s||!s.turn)return;
    if(allowed){t.st='ok';t.body+='\n  ✓ Compiled successfully in 41s';}
    pushItem({k:'ai',text:'构建通过。开始修改前，有一点需要你定一下。'});
    askQuestion(); render();
  },2200);
}
function finishAfterAnswer(){
  const s=S.session; s.turn='running';
  pushItem({k:'tool',name:'Edit',sum:'LoginForm.tsx · 失败时只清空密码',st:'run',body:'- clearForm()\n+ form.resetField("password")'});
  render();
  later(()=>{ if(S.session!==s||!s.turn)return;
    lastTool('Edit').st='ok';
    pushItem({k:'tool',name:'Bash',sum:'pnpm --filter web test auth',st:'run',body:'$ pnpm --filter web test auth'});
    render();
    later(()=>{ if(S.session!==s||!s.turn)return;
      const t=lastTool('Bash'); t.st='ok'; t.body+='\n ✓ LoginForm keeps email after failed sign-in\n Tests  18 passed';
      pushItem({k:'ai',text:'完成了：登录失败时只清空密码，邮箱会保留；错误提示保持原有文案。新增的回归测试和原有的 17 个测试全部通过。'});
      s.turn=null; drainQueue(); render(); toast('运行已完成');
    },1800);
  },1600);
}
function drainQueue(){
  const s=S.session; if(!s.queued) return;
  s.queued=0; s.turn='running';
  later(()=>{ if(S.session!==s)return; pushItem({k:'ai',text:'收到你补充的要求，我已经一起处理好了。'}); s.turn=null; render(); },2000);
}

/* ---------------- actions ---------------- */
const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, ds=el.dataset, s=S.session;
  switch(a){
    case 'back': back(); break;
    case 'go': go(ds.to); break;
    case 'acct-eye': S.account.show=!S.account.show; render(); break;
    case 'acct-signin': S.account.loading=true; render(); later(()=>{S.account.loading=false;S.account.step='request';render()},900); break;
    case 'acct-signout': S.account.step='signin'; S.account.key=''; render(); break;
    case 'acct-request': S.account.step='waiting'; S.account.waitLeft=300; render(); later(()=>{if(S.screen==='account'&&S.account.step==='waiting'){S.account.step='result';render()}},5000); break;
    case 'acct-cancel': S.account.step='request'; render(); break;
    case 'acct-done':
      S.hosts.forEach(h=>{if(h.id==='h3')h.status='online'});
      S.account.step='signin'; S.account.key='';
      resetTo('computers'); toast('已连接 2 台电脑'); break;
    case 'pair-paste': S.pair.ticket='mpt1:a1b2c3d4e5f6:Xk9pQ2vL7mN4rT8wY3zB'; S.pair.valid=true; render(); break;
    case 'pair-submit': S.pair.loading=true; render(); later(()=>{S.pair.loading=false;S.pair.ticket='';S.pair.valid=null; if(!host('h1'))S.hosts.unshift({id:'h1',name:'MacBook Pro',status:'online'}); S.hostId='h1'; resetTo('sessions',['computers']); toast('已连接 MacBook Pro')},1000); break;
    case 'plus': S.sheet={type:'plus'}; render(); break;
    case 'sheet-close': S.sheet=null; render(); break;
    case 'sheet-go': S.sheet=null; go(ds.to); break;
    case 'host-tap': { const h=host(ds.id); if(statusMeta[h.status].open){S.hostId=h.id; go('sessions')} else {S.expanded=S.expanded===h.id?null:h.id; render()} break; }
    case 'host-more': S.sheet={type:'host',id:ds.id}; render(); break;
    case 'host-fix': {
      const fix=ds.fix; if(fix==='forget'){S.sheet={type:'forget',id:ds.id};render()}
      else if(fix==='askagain'){toast('已重新申请，请到公司 iMac 上批准')}
      else {refreshHost(ds.id)} break; }
    case 'host-refresh': S.sheet=null; refreshHost(ds.id); break;
    case 'host-askagain': S.sheet=null; toast('已重新申请，请到公司 iMac 上批准'); break;
    case 'host-forget-ask': S.sheet={type:'forget',id:ds.id}; render(); break;
    case 'host-forget': { const h=host(ds.id); S.hosts=S.hosts.filter(x=>x.id!==ds.id); S.sheet=null; S.expanded=null; if(!S.hosts.length){resetTo('connect')} toast(`已忘记 ${h.name}`); break; }
    case 'sessions-refresh': enterScreen('sessions'); render(); break;
    case 'session-open': if(ds.t!=='重构登录流程'){toast('原型只演示“重构登录流程”这个会话')} else go('session'); break;
    case 'toggle': s.open[ds.key]=!s.open[ds.key]; render(); break;
    case 'stop': S.sheet={type:'stop'}; render(); break;
    case 'do-stop': {
      S.sheet=null; s.stopping=true; render();
      later(()=>{ s.stopping=false; s.turn=null; s.decisions=[]; s.queued=0;
        const t=lastTool('Bash'); if(t&&(t.st==='dec'||t.st==='run')){t.st='deny';t.body+='\n（已停止）'}
        pushItem({k:'note',text: ds.how==='now'?'已立即停止':'已在当前步骤后停止'}); render(); toast('已停止'); }, ds.how==='now'?700:1500);
      break; }
    case 'dec-prev': s.decIndex=Math.max(0,s.decIndex-1); render(); break;
    case 'dec-next': s.decIndex=Math.min(s.decisions.length-1,s.decIndex+1); render(); break;
    case 'decide': {
      const d=s.decisions[s.decIndex];
      if(ds.d==='allow'&&d.risk==='high'){S.sheet={type:'confirm-allow'};render();break}
      submitApproval(ds.d); break; }
    case 'allow-confirm': S.sheet=null; submitApproval('allow'); break;
    case 'opt': { const d=s.decisions[s.decIndex]; const q=d.questions[d.step]; const o=+ds.o; let cur=d.answers[d.step]||[];
      cur = q.multi ? (cur.includes(o)?cur.filter(x=>x!==o):[...cur,o]) : [o];
      d.answers[d.step]=cur; d.skipped[d.step]=false; render(); break; }
    case 'skip': { const d=s.decisions[s.decIndex]; d.skipped[d.step]=!d.skipped[d.step]; if(d.skipped[d.step]) d.answers[d.step]=[]; render(); break; }
    case 'q-next': s.decisions[s.decIndex].step++; render(); break;
    case 'q-prev': s.decisions[s.decIndex].step--; render(); break;
    case 'answer': {
      const d=s.decisions[s.decIndex]; s.pendingDecision='answer'; render();
      later(()=>{ s.pendingDecision=null;
        const txt=d.questions.map((q,qi)=>d.skipped[qi]?`${qi+1}. 跳过`:`${qi+1}. ${(d.answers[qi]||[]).map(o=>q.options[o]).join('、')}`).join('\n');
        s.decisions.splice(s.decIndex,1); s.decIndex=0; pushItem({k:'answer',text:txt}); finishAfterAnswer(); },800);
      break; }
    case 'send': sendMessage(); break;
    case 'reconnect': s.conn='retrying'; render(); later(()=>{s.conn='live';render();syncPanel()},1200); break;
  }
});
function submitApproval(which){
  const s=S.session; s.pendingDecision=which; render();
  later(()=>{ s.pendingDecision=null; s.decisions.splice(s.decIndex,1); s.decIndex=0;
    toast(which==='allow'?'已允许一次':'已拒绝'); runAfterApproval(which==='allow'); },900);
}
function refreshHost(id){
  const h=host(id); const prev=h.status; h.status='checking'; render();
  later(()=>{h.status=prev; render(); toast(prev==='offline'?'仍然离线':'状态已更新', prev!=='offline')},900);
}
function sendMessage(){
  const s=S.session; const text=S.draft.trim(); if(!text) return;
  const busy=!!turnLabel(s);
  const item={k:'user',text,pending:true}; pushItem(item); S.draft=''; s.sendFail=false; render();
  later(()=>{ item.pending=false;
    if(busy){ s.queued++; toast('已加入队列'); }
    else { s.turn='running'; later(()=>{ if(S.session!==s)return; pushItem({k:'ai',text:'收到。我会按这个方向继续，有需要你决定的地方会再问你。'}); s.turn=null; render(); },2200); }
    render(); },700);
}
app.addEventListener('input',e=>{
  const k=e.target.dataset.input; if(!k) return; const v=e.target.value;
  if(k==='akey'){S.account.key=v; const b=document.getElementById('signinBtn'); if(b) b.disabled=!v.trim()}
  if(k==='dname'){S.account.deviceName=v}
  if(k==='pname'){S.pair.deviceName=v}
  if(k==='ticket'){S.pair.ticket=v; if(!v.trim()) S.pair.valid=null}
  if(k==='composer'){
    const had=!!S.draft.trim(); S.draft=v; autosize(e.target);
    document.getElementById('sendBtn').disabled=!v.trim();
    if(had!==!!v.trim()&&turnLabel(S.session)) render();
  }
});
app.addEventListener('focusout',e=>{ if(e.target.dataset.input==='ticket'){ const v=S.pair.ticket.trim(); S.pair.valid = v? /^mpt1:[A-Za-z0-9]+:[A-Za-z0-9_-]+$/.test(v) : null; render(); } });
app.addEventListener('keydown',e=>{ if(e.target.id==='composer'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()} if(e.key==='Escape'&&S.sheet){S.sheet=null;render()} });

/* timers: countdowns */
setInterval(()=>{
  document.querySelectorAll('[data-expires]').forEach(el=>{el.textContent=expiresText(+el.dataset.expires)});
  if(S.screen==='account'&&S.account.step==='waiting'&&S.account.waitLeft>0){
    S.account.waitLeft--; const t=document.getElementById('waitT'); if(t)t.textContent=mmss(S.account.waitLeft);
    const arc=document.getElementById('ringArc'); if(arc){const C=2*Math.PI*46;arc.setAttribute('stroke-dashoffset',C*(1-S.account.waitLeft/300))}
  }
},1000);

/* ---------------- panel ---------------- */
function syncPanel(){
  document.querySelectorAll('#jump button').forEach(b=>b.classList.toggle('on',b.dataset.to===S.screen));
  document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.theme===S.theme));
  document.querySelectorAll('#acctSeg button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===S.accountMode));
  document.querySelectorAll('#connSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.session.conn));
}
document.getElementById('themeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.theme=b.dataset.theme;document.getElementById('phone').dataset.theme=S.theme;document.body.classList.toggle('page-dark',S.theme==='dark');render()});
document.getElementById('acctSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.accountMode=b.dataset.v==='1';render()});
document.getElementById('connSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.session.conn=b.dataset.v;if(S.screen!=='session'){S.hostId='h1';resetTo('session',['computers','sessions'])}else render()});
document.getElementById('jump').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const to=b.dataset.to;
  if(to==='account'){S.account.step='signin';S.account.key=''}
  const stacks={connect:[],account:['connect'],pair:['connect'],computers:[],sessions:['computers'],session:['computers','sessions']};
  if(to==='sessions'||to==='session'){S.hostId='h1'; if(!host('h1'))S.hosts.unshift({id:'h1',name:'MacBook Pro',status:'online'})}
  resetTo(to,stacks[to]);});
document.getElementById('reset').addEventListener('click',()=>{clearTimers();const th=S.theme;S=initialState();S.theme=th;lastScreen=null;render()});

const params=new URLSearchParams(location.search);
if(params.get('theme')==='dark'){S.theme='dark';document.getElementById('phone').dataset.theme='dark';document.body.classList.add('page-dark')}
if(params.get('screen')){const to=params.get('screen');const stacks={connect:[],account:['connect'],pair:['connect'],computers:[],sessions:['computers'],session:['computers','sessions']};S.screen=to;S.stack=stacks[to]||[];enterScreen(to)}
const phoneEl=document.getElementById('phone');
new ResizeObserver(()=>phoneEl.style.setProperty('--ph',phoneEl.clientHeight+'px')).observe(phoneEl);
render();
</script>
</body>
