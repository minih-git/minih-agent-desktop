[package]
name = "host-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minih-Agent-Desktop Rust host core"

[[bin]]
name = "minih-agent-desktop-host-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
globset = "0.4"
hex = "0.4"
ignore = "0.4"
regex = "1"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
mimalloc = { version = "0.1", default-features = false }
aes-gcm = "0.11"
argon2 = "0.5"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
easytier = { git = "https://github.com/EasyTier/EasyTier.git", rev = "0ca2fde0fb607949d6bcc169342fd74fca51aa12", default-features = false, features = [
    "aes-gcm",
    "dhcp-ipv4",
    "smoltcp",
    "socks5",
    "tun",
    "websocket",
    "tcp-hole-punch",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
