      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="880" fill="url(#bg)"/>
  <rect width="1440" height="880" fill="url(#ambient)"/>

  <!-- Drop-zone rings at 2x coordinates corresponding to (180, 196) and (540, 196) -->
  <circle cx="360" cy="392" r="144" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2.5"/>
  <circle cx="1080" cy="392" r="144" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2.5"/>

  <!-- Directional install arrow between (360, 392) and (1080, 392) -->
  <path d="M 556 392 H 864" stroke="url(#arrow-grad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 0"/>
  <path d="M 852 372 L 880 392 L 852 412" stroke="#2DD4BF" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top header badge -->
  <g transform="translate(694, 58) scale(0.05078125)">
    <rect width="1024" height="1024" rx="228" fill="url(#mark-bg)" stroke="#6366F1" stroke-opacity="0.4" stroke-width="24"/>
    <path d="M 280 408 V 740 M 744 408 V 740 M 280 574 H 744" stroke="url(#h-sculpt)" stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 512 156 C 512 228 548 268 620 268 C 548 268 512 308 512 380 C 512 308 476 268 404 268 C 476 268 512 228 512 156 Z" fill="url(#spark-grad)"/>
