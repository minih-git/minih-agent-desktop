<svg width="1440" height="880" viewBox="0 0 1440 880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D101B"/>
      <stop offset="0.5" stop-color="#131728"/>
      <stop offset="1" stop-color="#0E1320"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 392) scale(560 360)">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#2DD4BF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark-bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171B30"/>
