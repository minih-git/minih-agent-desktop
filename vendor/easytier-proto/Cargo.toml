[package]
name = "easytier-proto"
description = "EasyTier protobuf and generated RPC types."
homepage = "https://github.com/EasyTier/EasyTier"
repository = "https://github.com/EasyTier/EasyTier"
version = "2.7.0"
edition = "2024"
rust-version = "1.88"
authors = ["kkrainbow"]
keywords = ["vpn", "p2p", "network", "easytier"]
categories = ["network-programming"]
license-file = "../LICENSE"
build = "build/main.rs"

[dependencies]
optionize = { version = "0.5", optional = true }
anyhow = { version = "1.0", optional = true }
async-trait = { version = "0.1.92", optional = true }
auto_impl = { version = "1.3.0", optional = true }
base64 = { version = "0.22.1", optional = true }
bytes = { version = "1.12.1", optional = true }
chrono = { version = "0.4.45", features = ["serde"], optional = true }
cidr = { version = "0.3.2", features = ["serde"], optional = true }
hmac = { version = "0.12.1", optional = true }
prost = { version = "0.14.4", optional = true }
prost-types = { version = "0.14.4", optional = true }
prost-wkt-types = { version = "0.7.2", optional = true }
pbjson = { version = "0.9.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.10.9", optional = true }
strum = { version = "0.28.0", features = ["derive"], optional = true }
thiserror = { version = "2.0", optional = true }
tokio = { version = "1.53", default-features = false, features = ["time"], optional = true }
url = { version = "2.5", features = ["serde"], optional = true }
uuid = { version = "1.26.1", features = ["serde"], optional = true }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"], optional = true }

[build-dependencies]
anyhow = "1.0"
indoc = "2.0.7"
pbjson-build = "0.9.0"
proc-macro2 = "1"
prost = "0.14.4"
prost-build = "0.14.4"
prost-reflect = "0.16.4"
prost-types = "0.14.4"
protoc-bin-vendored = "3"
quote = "1"
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.53", default-features = false, features = [
    "macros",
    "rt",
] }
uuid = { version = "1.26.1", features = [
    "v4",
    "fast-rng",
] }

[features]
default = ["full"]
full = [
    "api",
    "core",
    "faketcp",
    "magic-dns",
    "quic",
    "utils",
    "websocket",
    "wireguard",
    "zstd",
    "json-rpc",
]
api = ["core"]
core = [
    "dep:optionize",
    "dep:anyhow",
    "dep:async-trait",
    "dep:auto_impl",
    "dep:base64",
    "dep:bytes",
    "dep:chrono",
    "dep:cidr",
    "dep:hmac",
    "dep:pbjson",
    "dep:prost",
    "dep:prost-types",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:strum",
    "dep:thiserror",
    "dep:tokio",
    "dep:url",
    "dep:uuid",
    "dep:x25519-dalek",
]
faketcp = []
magic-dns = []
quic = []
utils = []
websocket = []
wireguard = []
zstd = []
json-rpc = ["dep:prost-wkt-types"]
